# App icon generator config. Regenerate after changing the images with:
#   dart run flutter_launcher_icons
#
# assets/icon/app_icon.png is the full-bleed master (flat navy #052647, the
# app's AppColors.navy). Each platform cuts it to its own shape, so the image
# itself has no rounded corners.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: true
  # Android 8+: adaptive icon. The launcher picks the shape (circle, squircle,
  # ...); the navy background layer matches the master's navy, so the 16%
  # inset around the artwork is seamless.
  adaptive_icon_background: "#052647"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 16
  # Older Android shows the image as-is: same art, rounded, transparent corners.
  image_path_android: "assets/icon/app_icon_android_legacy.png"
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true
